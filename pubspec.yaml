name: study_material_app
description: Hệ thống Quản lý Tài liệu Đa nền tảng - Firebase & Supabase
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  intl: ^0.20.3
  uuid: ^4.6.0
  path_provider: ^2.1.6
  path: ^1.9.1
  sqflite: ^2.4.4
  sqflite_common_ffi: ^2.4.3

  firebase_core: ^3.13.1
  firebase_auth: ^5.5.1
  google_sign_in: ^6.2.2

  supabase_flutter: ^2.18.3

  file_picker: ^8.1.4

  http: ^1.4.0
  url_launcher: ^6.3.3
  cloud_functions: ^5.6.2
  sqflite_common_ffi_web: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # 2.3.x switches to JNI; its native library fails to load on the tested Android 9 device.
  path_provider_android: 2.2.23

flutter:
  uses-material-design: true
